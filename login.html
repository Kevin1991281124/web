<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso SITI — CETI Plantel Tonalá</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- Encabezado superior azul que se difumina a negro -->
    <header class="top-header">
        <h1 id="topTitle">Registrarse</h1>
    </header>

    <div class="container">
        
        <!-- Botones transparentes (solo texto) -->
        <div class="tabs-container">
            <button type="button" class="tab-btn active" id="tabRegisterBtn">Registrarse</button>
            <button type="button" class="tab-btn" id="tabLoginBtn">Iniciar Sesión</button>
        </div>

        <!-- FORMULARIO 1: REGISTRO -->
        <form id="registerForm" class="form-section active">
            <div class="input-group">
                <label for="fullname">Nombre Completo</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nombre y apellidos">
            </div>

            <div class="input-group">
                <label for="regnumber">Número de Registro / Matrícula</label>
                <input type="text" id="regnumber" name="regnumber" placeholder="Ej. 21300123">
            </div>

            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com">
            </div>

            <div class="input-group">
                <label for="career">Carrera</label>
                <select id="career" name="career">
                    <option value="" disabled selected>Selecciona tu carrera...</option>
                    <option value="Desarrollo de Software">Desarrollo de Software</option>
                    <option value="Desarrollo Electrónico">Desarrollo Electrónico</option>
                    <option value="Calidad">Calidad</option>
                    <option value="Químico en Fármaco">Químico en Fármaco</option>
                    <option value="Químico en Alimentos">Químico en Alimentos</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Registrar</button>
        </form>

        <!-- FORMULARIO 2: INICIO DE SESIÓN -->
        <form id="loginForm" class="form-section">
            <div class="input-group">
                <label for="loginUser">Correo o Número de Registro</label>
                <input type="text" id="loginUser" name="loginUser" placeholder="Usuario o correo">
            </div>

            <div class="input-group">
                <label for="loginPassword">Contraseña</label>
                <input type="password" id="loginPassword" name="loginPassword" placeholder="Contraseña">
            </div>

            <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>

    </div>

    <!-- Archivo Controlador único dentro de la carpeta js -->
    <script src="js/controller.js"></script>
</body>
</html>
